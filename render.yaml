services:
  - type: web
    name: aaharlink-api
    runtime: python
    plan: free
    rootDir: backend/python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FRONTEND_ORIGINS
        sync: false
